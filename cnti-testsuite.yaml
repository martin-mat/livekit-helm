---
# CNTi Test Suite configuration for the livekit-server chart in this
# repository.
config_version: "v2"
common:
  container_names:
    # Retained image tags used by the rolling update, downgrade and rollback
    # tests; the chart's appVersion is the tag under test.
    - name: livekit-server
      rolling_update_test_tag: "v1.10.1"
      rolling_downgrade_test_tag: "v1.9.12"
      rolling_version_change_test_tag: "v1.10.1"
      rollback_from_tag: "v1.10.1"
deployments:
  helm_dirs:
    - name: livekit
      helm_directory: livekit-server
      namespace: livekit-cnti
      helm_values: --values ci/cnti-values.yaml
